[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfs-track-b"
version = "0.1.0"
description = "Metadata profiling and Bio-RAG context for pathway-informed feature selection"
requires-python = ">=3.11"
dependencies = ["biopython", "pydantic>=2", "requests", "numpy", "pandas"]

[project.optional-dependencies]
agents = ["langgraph"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
